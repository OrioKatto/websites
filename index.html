<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orio's Extreme Demon List</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>Orio's Extreme Demons</h1>
    <img src="images/ychorio.gif" alt="Orio" class="header-gif">
  </header>

  <section class="current-level">
    <span class="current-label">Current:</span>
    <span class="current-name" id="current-level-name">DISSONANCE by ivyteal</span>
  </section>

  <section class="levels">
    <h2>The List</h2>
    <div id="levels-container">
      <p class="loading">Loading...</p>
    </div>
  </section>

  <section class="stats" id="stats">
    <div class="stat-card teal">
      <span class="stat-label">Total Extremes</span>
      <span class="stat-value" id="total-levels">—</span>
    </div>
    <div class="stat-card orange">
      <span class="stat-label">Average Enjoyment</span>
      <span class="stat-value" id="avg-enjoyment">—</span>
    </div>
    <div class="stat-card purple">
      <span class="stat-label">Average Worst Fail</span>
      <span class="stat-value" id="avg-worst-fail">—</span>
    </div>
  </section>

  <footer>
    <p>hi paws at you</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
